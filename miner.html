<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄金矿工 · 落日矿场</title><style>
*{box-sizing:border-box}body{margin:0;background:#231c19;color:#fff0cd;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:930px;margin:auto;padding:clamp(12px,4vw,42px) 16px}.top,footer,.meters{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{color:#ffcd74;letter-spacing:.18em;font:bold 12px monospace}.serial,footer{color:#cfbb9e;font-size:13px}h1{font-size:clamp(32px,5vw,54px);line-height:1.05;margin:16px 0 7px}.sub{color:#ddc7ac;margin:0 0 16px}.meters{background:#392c25;padding:12px 16px;border:1px solid #695142;border-radius:12px 12px 0 0;flex-wrap:wrap}.meters b{color:#ffcc73;font-variant-numeric:tabular-nums}.stage{position:relative;border:1px solid #695142;border-top:0;overflow:hidden;border-radius:0 0 12px 12px}canvas{width:100%;display:block;touch-action:manipulation}.veil{position:absolute;inset:0;display:grid;place-items:center;background:#281a165e}.veil[hidden]{display:none}.card{text-align:center;color:#3a271c;background:#f8e8bd;border:3px double #987645;padding:clamp(12px,2.2vw,27px);border-radius:8px;box-shadow:6px 6px 0 #38271878;max-width:95%}.card small{font:11px monospace;color:#866138;letter-spacing:.2em}.card h2{font-size:clamp(22px,4vw,36px);margin:4px}.card p{margin:4px 0 12px;font-size:14px}button{border:0;border-radius:7px;padding:10px 24px;font:inherit;font-weight:750;background:#ffc363;color:#382719;cursor:pointer;touch-action:manipulation}.card button{background:#423327;color:#fff0c7}footer{flex-wrap:wrap;margin-top:12px}.guide{font-size:13px;color:#d4bea1;margin-top:12px}button:focus-visible{outline:3px solid #58dfcf}@media(max-width:520px){.meters{font-size:12px;gap:4px;padding:8px}.serial{display:none}.card p{font-size:12px}main{padding:14px 8px}}
.shop{margin:8px auto;display:grid;gap:4px;max-width:390px}.shop[hidden]{display:none}.shop button{font-size:13px;padding:5px 8px;border:1px solid #a48a62;background:#fff1ce;color:#4a341f}.shop button:disabled{opacity:.52}.stage:has(.shop:not([hidden])){min-height:330px}.pack{min-height:1.3em;color:#e6ca98;font-size:13px;margin:6px 0}.card h2{line-height:1.1}</style><main><div class="top"><span class="brand">✦　GOLDEN GULCH</span><span class="serial">落日矿业　/　采掘日志</span></div><h1>黄金矿工</h1><p class="sub">看准摆动的钩爪，把地下的宝藏拉上来。</p><div class="meters"><strong id="level"></strong><span>收入 <b id="cash"></b></span><span>目标 <b id="goal"></b></span><span>剩余 <b id="time"></b></span></div><div class="pack" id="pack"></div><div class="stage"><canvas id="field" width="760" height="490" aria-label="落日矿场，点击放钩"></canvas><div id="veil" class="veil"><div class="card"><small>GOLDEN GULCH MINING CO.</small><h2 id="heading">落日矿场</h2><p id="hint">每班 60 秒，达标后可以继续挖。盯住背着蓝钻的鼹鼠！</p><div class="shop" id="shop" hidden><strong id="wallet"></strong><button id="potion"></button><button id="charge"></button><button id="clover"></button></div><button id="start">开始采矿　▶</button></div></div></div><footer><button id="launch">↓　放钩</button><span>空格 / ↓ 放钩　·　手机点击矿场放钩</span></footer><div class="guide">矿价表　✦ 小金块 ¥80　·　大金块 ¥180　·　钻石 ¥240　·　石头 ¥15　·　金币袋 ¥10–200　·　炸药桶碎片 ¥10　·　鼹鼠 ¥10　·　钻石鼹鼠 ¥250</div></main><script>
const $=id=>document.getElementById(id),g=$('field').getContext('2d');
const ore={g:{r:13,value:80,speed:175},G:{r:24,value:180,speed:90},d:{r:10,value:240,speed:215},r:{r:19,value:15,speed:65}};
const seams=[
['浅层金脉',400,[['g',272,180],['G',495,246],['g',185,292],['d',346,370],['r',391,237],['r',566,348],['G',264,422],['g',632,420]]],
['红岩断层',560,[['g',305,213],['r',439,205],['G',210,302],['r',368,313],['d',541,345],['g',601,284],['G',471,423],['d',160,426],['g',317,438]]],
['深井星砂',700,[['r',316,201],['g',431,203],['r',509,277],['G',220,302],['d',376,344],['r',294,350],['g',590,341],['d',188,434],['G',481,430],['d',638,438]]]
];
const px=380,py=89,rest=24;
let level=0,items,cash,time,angle,length,phase,hook,cargo,state,last,tip,tipTime;
const specials=[
  [['m',300,367],['b',528,302],['t',228,383]],
  [['m',440,244],['m',238,420],['b',392,398],['t',562,397]],
  [['m',370,240],['m',538,432],['b',427,297],['b',285,405],['t',570,405]]
];
Object.assign(ore,{m:{r:14,value:10,speed:165},b:{r:15,speed:82},t:{r:17,value:10,speed:240},f:{r:8,value:10,speed:240}});
const prices={potion:100,charge:45,clover:75};
let bank=0,gear={potion:0,charge:0,clover:0},startingCharges=0,blasts=[];
function setup(){
  items=[...seams[level][2],...specials[level]].map(([type,x,y],i)=>{
    const o={type,x,y,...ore[type]};
    if(type==='b'){o.value=10+Math.floor(Math.random()*191);o.lucky=gear.clover&&Math.random()<.4;if(o.lucky)o.value+=50}
    if(type==='m'){o.home=x;o.phase=i*2;o.x=x+Math.sin(o.phase)*120}
    return o;
  });
  cash=0;time=60;angle=0;length=rest;phase=0;hook='aim';cargo=null;tip='';tipTime=0;blasts=[];hud()
}
function hud(){
  $('level').textContent='0'+(level+1)+' / '+seams[level][0];$('cash').textContent='¥'+cash;$('goal').textContent='¥'+seams[level][1];$('time').textContent=Math.ceil(time)+' 秒';
  $('pack').textContent='背包　炸药 ×'+gear.charge+(gear.potion?'　·　大力药水生效':'')+(gear.clover?'　·　幸运草生效':'');
  $('launch').textContent=hook==='in'&&cargo?.type==='r'&&gear.charge?'✸　炸掉石头':'↓　放钩';
}
function refreshShop(){
  $('wallet').textContent='可用余额　¥'+bank;
  const labels={potion:'大力药水 · 下关收绳快 50%',charge:'炸药 · 一次弃石',clover:'幸运草 · 下关每袋 40% 概率多 ¥50'};
  for(const k of Object.keys(prices)){
    const bought=k!=='charge'&&gear[k]>0;
    $(k).textContent=labels[k]+'　'+(bought?'已购':'¥'+prices[k])+(k==='charge'?'　持有 '+gear.charge:'');
    $(k).disabled=bought||bank<prices[k];
  }
}
function buy(k){if(state!=='shop'||bank<prices[k]||(k!=='charge'&&gear[k]))return;bank-=prices[k];gear[k]++;refreshShop();hud()}
function start(){
  if(state==='shop'){level++;startingCharges=gear.charge}
  else if(state==='complete'){level=0;bank=0;gear={potion:0,charge:0,clover:0};startingCharges=0}
  else if(state==='lost')gear.charge=startingCharges;
  setup();state='play';$('veil').hidden=true;$('shop').hidden=true;$('start').blur()
}
function finish(reason){
  const win=cash>=seams[level][1];
  state=win?(level===seams.length-1?'complete':'shop'):'lost';
  if(win)bank+=cash;
  $('veil').hidden=false;$('shop').hidden=state!=='shop';
  $('heading').textContent=state==='shop'?'收工 · 矿工补给站':state==='complete'?'三个矿区全部达标！':reason==='short'?'矿藏价值不足':'收工铃响了';
  $('hint').textContent='本班收入 ¥'+cash+'　/　目标 ¥'+seams[level][1];
  $('start').textContent=state==='shop'?'出发 · 下一矿区　›':state==='lost'?'重试本矿区　↻':'从头再玩　↻';
  if(state==='shop'){gear.potion=0;gear.clover=0;refreshShop()}
}
function fire(){
  if(state!=='play')return;
  if(hook==='aim')hook='out';
  else if(hook==='in'&&cargo?.type==='r'&&gear.charge){gear.charge--;cargo=null;const p=point();blasts.push({...p,r:18,time:.28});hud()}
}
function point(){return {x:px+Math.sin(angle)*length,y:py+Math.cos(angle)*length}}
function hitBarrel(barrel){
  const queue=[barrel];
  for(const source of queue){
    blasts.push({x:source.x,y:source.y,r:62,time:.32});
    items=items.filter(o=>{if(Math.hypot(o.x-source.x,o.y-source.y)>62+o.r)return true;if(o.type==='t')queue.push(o);return false});
  }
  return {type:'f',...ore.f}
}
function moveMoles(dt){
  for(const mole of items.filter(o=>o.type==='m')){
    mole.phase+=dt*.85;
    mole.x=mole.home+Math.sin(mole.phase)*120;
    if(mole.hasDiamond)continue;
    const index=items.findIndex(o=>o.type==='d'&&Math.hypot(o.x-mole.x,o.y-mole.y)<=o.r+mole.r);
    if(index<0)continue;
    const [diamond]=items.splice(index,1);
    mole.hasDiamond=true;
    mole.value+=diamond.value;
  }
}
function update(dt){
  if(state!=='play')return;
  time=Math.max(0,time-dt);tipTime-=dt;blasts=blasts.filter(b=>(b.time-=dt)>0);
  if(time<=0){hud();finish('time');return}
  moveMoles(dt);
  if(hook==='aim'){phase+=dt*1.55;angle=Math.sin(phase)*1.14}
  else if(hook==='out'){
    length+=dt*320;const p=point();
    const i=items.findIndex(o=>Math.hypot(p.x-o.x,p.y-o.y)<=o.r+4);
    if(i>=0){cargo=items.splice(i,1)[0];if(cargo.type==='t')cargo=hitBarrel(cargo);hook='in'}
    else if(p.y>=481||p.x<8||p.x>752)hook='in'
  }else{
    length=Math.max(rest,length-dt*(cargo?cargo.speed:330)*(gear.potion?1.5:1));
    if(length===rest){
      if(cargo){cash+=cargo.value;tip=(cargo.hasDiamond?'钻石鼹鼠！':cargo.lucky?'幸运！':'')+'+¥'+cargo.value;tipTime=1;cargo=null}
      hook='aim'
    }
  }
  hud();
  const possible=cash+(cargo?.value??0)+items.reduce((n,o)=>n+o.value,0);
  if(possible<seams[level][1])finish('short');
}
function poly(points,fill){g.fillStyle=fill;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}
function line(points,c,w){g.strokeStyle=c;g.lineWidth=w;g.lineJoin='round';g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke()}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function disk(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function mineral(o,x=o.x,y=o.y){g.save();g.translate(x,y);g.scale(o.r,o.r);
if(o.type==='m'){if(Math.cos(o.phase)<0)g.scale(-1,1);disk(0,0,.88,'#4a3430');disk(.46,-.19,.57,'#69504c');disk(.88,-.08,.23,'#f6ab9b');disk(.51,-.36,.12,'#fff0cc');disk(-.43,.57,.30,'#c09c88');if(o.hasDiamond){g.save();g.translate(-.25,-.75);poly([[-.69,-.18],[-.41,-.58],[.38,-.58],[.71,-.18],[0,.53]],'#54dbdf');poly([[-.41,-.58],[.38,-.58],[.16,-.18],[-.29,-.18]],'#d9fffc');g.restore()}}
else if(o.type==='b'){poly([[-.4,-.94],[.44,-.94],[.22,-.47],[.86,.22],[.77,.78],[0,1],[-.8,.72],[-.85,.15],[-.24,-.47]],'#c4934f');rect(-.35,-.54,.7,.16,'#684b30');disk(0,.28,.4,'#ffce64');line([[0,.04],[0,.49]],'#9f722a',.1)}
else if(o.type==='t'){rect(-.78,-1,1.56,2,'#ae4b37');rect(-.83,-.75,1.66,.18,'#513c38');rect(-.83,.6,1.66,.18,'#513c38');poly([[0,-.47],[.45,.39],[-.45,.39]],'#ffcb72');rect(-.07,-.15,.14,.29,'#59362a')}
else if(o.type==='f'){poly([[-.8,-.4],[-.25,-.85],[.2,-.52],[.8,-.76],[.55,.54],[-.42,.8]],'#cf7861')}
else if(o.type==='d'){poly([[-1,-.35],[-.5,-.87],[.55,-.87],[1,-.35],[0,1]],'#51cfcb');poly([[-1,-.35],[-.4,-.35],[0,1]],'#258a9b');poly([[-.5,-.87],[.55,-.87],[.33,-.35],[-.4,-.35]],'#c9fff4')}
else{const rock=o.type==='r';poly([[-1,.25],[-.76,-.55],[-.28,-.86],[.38,-.94],[.93,-.35],[1,.39],[.42,.87],[-.57,.82]],rock?'#78807e':'#ecad36');poly([[-1,.25],[-.76,-.55],[-.28,-.86],[.38,-.94],[.09,-.38],[-.55,-.15]],rock?'#a1a3a0':'#ffe597');poly([[-.57,.82],[.15,.29],[.93,-.35],[1,.39],[.42,.87]],rock?'#515b5c':'#b97828')}g.restore()}
function scene(){rect(0,0,760,100,'#eaa976');disk(620,30,21,'#ffdc9c');poly([[0,78],[75,34],[122,65],[206,20],[293,72],[480,52],[574,67],[701,28],[760,55],[760,104],[0,104]],'#bc8069');poly([[0,93],[130,65],[233,92],[360,51],[499,89],[616,61],[760,84],[760,106],[0,106]],'#946855');
const grad=g.createLinearGradient(0,95,0,490);grad.addColorStop(0,'#8d563c');grad.addColorStop(.54,'#68402f');grad.addColorStop(1,'#452d2b');g.fillStyle=grad;g.fillRect(0,98,760,392);
for(let j=0;j<5;j++){let pts=[];for(let i=0;i<15;i++)pts.push([i*58,130+77*j+Math.sin(i*.74+j)*12+Math.cos(i*2)*4]);line(pts,'#e2a56c19',3)}
for(let i=0;i<130;i++){let x=(i*197+37)%760,y=112+(i*89)%378;rect(x,y,2+i%4,1+i%2,i%3?'#edb37b25':'#392b263b')}
rect(0,97,760,5,'#cf935b');rect(318,83,125,9,'#574032');rect(326,92,8,19,'#684832');rect(427,92,8,19,'#684832');
rect(342,59,20,23,'#446776');rect(343,76,7,9,'#3d3931');rect(355,76,7,9,'#3d3931');disk(352,53,10,'#dc9e68');rect(342,52,21,4,'#f9bd51');disk(352,50,8,'#f0aa39');rect(339,51,26,4,'#ffcb64');rect(359,61,14,5,'#dfac7b');disk(px,80,11,'#393a34');disk(px,80,7,'#b89870');disk(px,80,3,'#e5c792');
items.forEach(o=>mineral(o));for(const b of blasts){g.save();g.globalAlpha=b.time/.32*.72;disk(b.x,b.y,b.r*(1.05-b.time),'#ffd36c');g.restore()}let p=point();line([[px,85],[p.x,p.y]],'#eed9ad',2);if(cargo)mineral(cargo,p.x,p.y+5);g.save();g.translate(p.x,p.y);g.rotate(-angle);line([[-1,-5],[-7,1],[-7,7],[-3,10]],'#d6d7c0',3);line([[1,-5],[7,1],[7,7],[3,10]],'#d6d7c0',3);g.restore();if(tipTime>0){g.fillStyle='#ffef9c';g.font='bold 18px system-ui';g.fillText(tip,395,63)}}
function frame(now){const dt=Math.min(.05,(now-(last??now))/1000);last=now;update(dt);scene();requestAnimationFrame(frame)}
for(const k of Object.keys(prices))$(k).onclick=()=>buy(k);$('start').onclick=start;$('launch').onclick=fire;$('field').onpointerdown=fire;onkeydown=e=>{if(state==='play'&&(e.code==='Space'||e.code==='ArrowDown')){e.preventDefault();if(!e.repeat)fire()}};setup();state='ready';requestAnimationFrame(frame)
</script></html>
