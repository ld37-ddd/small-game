<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>炸弹人 · 引信实验室</title><style>
*{box-sizing:border-box}body{margin:0;background:#131817;color:#f4efdd;font:16px system-ui,"Microsoft YaHei",sans-serif}main{max-width:960px;margin:auto;padding:clamp(14px,4vw,48px)}header,footer,.strip{display:flex;align-items:center;justify-content:space-between;gap:12px}.tag,small{color:#abbdac;font:12px monospace;letter-spacing:.13em}.tag{color:#dfed9c}h1{font-size:clamp(32px,5vw,56px);margin:6px 0 12px;letter-spacing:-.06em}h1 span{color:#dce89d}p{margin:0;line-height:1.6;color:#c9d1c6}.shell{background:#282e29;border:2px solid #485047;padding:clamp(6px,1vw,12px);border-radius:10px;box-shadow:0 8px 0 #0c100e;margin:18px 0}.strip{flex-wrap:wrap;padding:0 4px 8px;font-size:14px;font-weight:700}.board{position:relative}canvas{display:block;width:100%;image-rendering:pixelated;aspect-ratio:15/11}.cover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#10181291}.cover[hidden]{display:none}.panel{background:#202923;border:2px solid #84957b;box-shadow:6px 6px 0 #101813;padding:clamp(13px,3vw,32px)}h2{margin:5px 0 8px}button{font:inherit;font-weight:700;cursor:pointer;color:#172019;background:#dce89d;border:0;border-radius:4px;padding:9px 18px;touch-action:none}button:focus-visible{outline:3px solid #ffad68}.panel button{margin-top:12px}.pad{display:flex;flex-wrap:wrap;gap:6px}.pad button{background:#354039;color:#e2eadc}.pad button:last-child{background:#ffc082;color:#33281a}footer{flex-wrap:wrap}.legend{font-size:13px;color:#afbcae}@media(max-width:580px){.panel p{font-size:13px}header small{display:none}main{padding:14px 8px}}
.mapbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin:18px 0 -6px}.mapbar label{font-size:13px;color:#c4cda7;font-weight:700}.mapbar select{background:#26342f;border:1px solid #667764;color:#f2f2dd;border-radius:5px;padding:7px 12px;font:inherit}.mapbar span{font-size:13px;color:#afbcaf}</style><style>#arcade-navigation{position:relative;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;box-sizing:border-box;padding:12px 20px;background:#172922;color:#e1e9d6;font:13px system-ui,sans-serif;border-bottom:1px solid #526153}#arcade-navigation a{display:inline-block;color:#e1e9d6;text-decoration:none;border:1px solid #74856f;border-radius:7px;padding:7px 12px;font-weight:700}#arcade-navigation a:hover{background:#3a5140}#arcade-navigation a:focus-visible{outline:3px solid #f5d396}#arcade-navigation span{font-size:12px}</style><nav id="arcade-navigation" aria-label="游戏大厅导航"><a href="index.html">← 返回游戏厅</a><span>炸弹人</span></nav><main><header><div class="tag">▦　FUSE LAB　/　ARCADE 01</div><small>FIELD OPERATIONS DIVISION</small></header><h1>炸弹人<span> · </span>引信实验室</h1><p>炸开红砖，收集三枚能量晶体，再前往右下角的出口。</p><div class="mapbar"><label for="maps">行动地图</label><select id="maps"><option value="0">01　引信实验室</option><option value="1">02　冷却环廊</option><option value="2">03　赤砂仓库</option><option value="3">04　紫晶桥站</option></select><span id="brief"></span></div><div class="shell"><div class="strip"><span id="count">◆　晶体 0 / 3</span><span id="gear"></span><span id="status">引信待命</span></div><div class="board"><canvas id="board" width="480" height="352" aria-label="炸弹人迷宫"></canvas><div id="cover" class="cover"><div class="panel"><small id="sector">FUSE LAB　//　01</small><h2 id="heading">爆破行动</h2><p id="hint">红盔是敌人。留意引信，放弹后绕到墙后！</p><button id="start">进入迷宫　▶</button></div></div></div></div><footer><div class="pad"><button data-key="left" aria-label="左">←</button><button data-key="up" aria-label="上">↑</button><button data-key="down" aria-label="下">↓</button><button data-key="right" aria-label="右">→</button><button id="drop">放炸弹</button></div><small>方向键 / WASD 移动　·　空格 放弹</small></footer><p class="legend" style="margin-top:12px">蓝靴加速　·　金色炸弹包增加投弹上限　·　橙红砖墙可炸碎　·　灰色石墙可掩护　·　爆风最远两格</p></main><script>
const $=id=>document.getElementById(id),ctx=$('board').getContext('2d'),cols=15,rows=11;
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const layout=[
'###############',
'#..SB.B..B...C#',
'#.#.#.#B#.#B#.#',
'#AB.B...B.AB..#',
'#.#B#.#.#B#.#.#',
'#..B..BCB..B..#',
'#.#.#B#.#.#B#.#',
'#B...B.B.SB...#',
'#.#B#.#B#.#.#B#',
'#C.B..B...B..E#',
'###############'];
const stages=[
  {name:'引信实验室',brief:'石柱交错，借拐角避开爆风。',layout,bots:[[13,3],[9,9]],floor:['#304137','#34463b']},
  {name:'冷却环廊',brief:'沿内外环绕行，从两侧绕过防线。',bots:[[12,1],[7,7]],floor:['#29454e','#2c4a52'],layout:[
    '###############',
    '#..S.B.C.B....#',
    '#.#####.#####.#',
    '#A..B....AB...#',
    '#B#.###B###.#B#',
    '#C#...B.B...#C#',
    '#.#.###.###.#.#',
    '#...B....SB...#',
    '#.#####B#####.#',
    '#....B...B...E#',
    '###############']},
  {name:'赤砂仓库',brief:'成排的砖垛挡路，自己炸出捷径。',bots:[[13,5],[7,9]],floor:['#514237','#554639'],layout:[
    '###############',
    '#..S.BB.C.BB..#',
    '#..#.BB.#.BB..#',
    '#A.#.BB.#ABB..#',
    '#B............#',
    '#..BBB.C.BBB..#',
    '#..BBB.#.BBB..#',
    '#......B..S...#',
    '#..#.BB.#.BB..#',
    '#C...BB...BB.E#',
    '###############']},
  {name:'紫晶桥站',brief:'三条横桥连通两岸，中桥晶体最易遭遇夹击。',bots:[[13,1],[12,9]],floor:['#3e384b','#453d53'],layout:[
    '###############',
    '#..S.B##C.....#',
    '#..#..##..#...#',
    '#A.B....B.A...#',
    '#..#..##..#B..#',
    '#....B.C.B....#',
    '#B.#..##..#...#',
    '#....B...BS...#',
    '#..#..##..#B..#',
    '#C..B.##.....E#',
    '###############']}
];
let stage=stages[0];
let map,player,bombs,bots,flames,cool,held,mode,collected,clock=0,last=0;
function reset(){map=stage.layout.map(r=>Array.from(r));player={x:1,y:1,id:0,speed:0,capacity:1};bombs=[];bots=stage.bots.map(([x,y],i)=>({x,y,id:i+1,speed:0,capacity:1,wait:1+i*.3,rearm:2+i}));flames=[];cool=0;held=null;collected=0;mode='play';$('cover').hidden=true;hud()}
function hud(){$('gear').textContent='速度 ×'+(1+player.speed*.25)+'　·　可投 '+(player.capacity-bombs.filter(b=>b.owner===0).length)+'/'+player.capacity;const bomb=bombs.find(b=>b.owner===0);$('count').textContent='◆　晶体 '+collected+' / 3　·　敌人 '+bots.length;$('status').textContent=bomb?'引信　'+bomb.time.toFixed(1)+' s':collected===3?'出口已开启':'引信待命'}
function finish(won){mode=won?'win':'lost';held=null;$('cover').hidden=false;$('heading').textContent=won?'撤离成功！':'被爆风击中';$('hint').textContent=won?'三枚晶体已安全带出实验室。':'试试放弹后拐个弯，让墙挡住爆风。';$('start').textContent='再来一局　↻'}
function collect(actor){
  const item=map[actor.y][actor.x];
  if(item==='S')actor.speed++;
  else if(item==='A')actor.capacity++;
  else return;
  map[actor.y][actor.x]='.';hud();
}
function stepTime(actor){return (actor.id===0?.13:.32)/(1+actor.speed*.25)}
function canPlant(actor){return bombs.filter(b=>b.owner===actor.id).length<actor.capacity&&!bombs.some(b=>same(b,actor))}
function checkCell(){if(flames.some(f=>f.x===player.x&&f.y===player.y)){finish(false);return}collect(player);let tile=map[player.y][player.x];if(tile==='C'){map[player.y][player.x]='.';collected++;hud()}if(tile==='E'&&collected===3)finish(true)}
function move(key){if(mode!=='play'||cool>0)return;let [dx,dy]=dirs[key],x=player.x+dx,y=player.y+dy;if('#B'.includes(map[y][x])||bombs.some(b=>b.x===x&&b.y===y)||bots.some(b=>b.x===x&&b.y===y))return;Object.assign(player,{x,y});checkCell();cool=stepTime(player)}
const same=(a,b)=>a.x===b.x&&a.y===b.y;
const code=p=>p.y*cols+p.x;
function footprint(pos){
  const cells=[pos];
  for(const [dx,dy] of Object.values(dirs)){
    for(let i=1;i<=2;i++){
      const x=pos.x+dx*i,y=pos.y+dy*i,tile=map[y][x];
      if(tile==='#')break;
      cells.push({x,y});
      if(tile==='B')break;
    }
  }
  return cells;
}
function plant(pos,owner){bombs.push({x:pos.x,y:pos.y,time:2,owner});hud()}
function drop(){
  if(mode==='play'&&canPlant(player)&&!flames.some(f=>same(f,player)))plant(player,0);
}
function detonate(){
  const due=new Set(bombs.filter(b=>b.time<=0||flames.some(f=>same(f,b))));
  if(!due.size)return;
  const burst=new Map();
  for(const bomb of due){
    for(const cell of footprint(bomb)){
      burst.set(code(cell),cell);
      for(const other of bombs)if(same(other,cell))due.add(other);
    }
  }
  bombs=bombs.filter(b=>!due.has(b));
  for(const cell of burst.values()){
    if('BSA'.includes(map[cell.y][cell.x]))map[cell.y][cell.x]='.';
    flames.push({x:cell.x,y:cell.y,time:.42});
  }
  bots=bots.filter(bot=>!burst.has(code(bot)));
  checkCell();hud();
}
function routes(bot,danger,escaping){
  const queue=[{x:bot.x,y:bot.y,steps:0}],seen=new Set([code(bot)]);
  for(let i=0;i<queue.length;i++){
    const here=queue[i];
    for(const [dx,dy] of Object.values(dirs)){
      const next={x:here.x+dx,y:here.y+dy},id=code(next);
      if(seen.has(id)||'#B'.includes(map[next.y][next.x])||same(next,player))continue;
      if(bombs.some(b=>same(next,b))||bots.some(b=>same(next,b))||flames.some(f=>same(next,f)))continue;
      if(!escaping&&danger.has(id))continue;
      seen.add(id);queue.push({...next,first:here.first||next,steps:here.steps+1});
    }
  }
  return queue;
}
function think(bot){
  const danger=new Set(bombs.flatMap(footprint).map(code));
  const unsafe=danger.has(code(bot));
  const paths=routes(bot,danger,unsafe);
  if(unsafe){
    const escape=paths.find(p=>!danger.has(code(p)));
    if(escape?.first)Object.assign(bot,escape.first);
    return;
  }
  const loot=paths.find(p=>p.steps>0&&p.steps<=4&&'SA'.includes(map[p.y][p.x]));
  if(loot){Object.assign(bot,loot.first);return}
  const range=footprint(bot);
  const target=range.some(p=>same(p,player)||map[p.y][p.x]==='B');
  if(target&&bot.rearm<=0&&canPlant(bot)){
    const after=new Set([...danger,...range.map(code)]);
    const exit=paths.find(p=>!after.has(code(p))&&p.steps<=4);
    if(exit){plant(bot,bot.id);bot.rearm=bot.capacity>1?.55:4.8;Object.assign(bot,exit.first);return}
  }
  const distance=p=>Math.abs(p.x-player.x)+Math.abs(p.y-player.y);
  const best=paths.reduce((a,b)=>distance(b)<distance(a)?b:a);
  if(best.first)Object.assign(bot,best.first);
}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function tile(x,y,t){let a=x*32,b=y*32;const r=(i,j,w,h,c)=>rect(a+i,b+j,w,h,c);
r(0,0,32,32,stage.floor[(x+y)%2]);r(3,26,3,1,'#465649');
if(t==='#'){r(0,0,32,32,'#222c29');r(1,1,30,27,'#647269');r(3,3,26,21,'#78867a');r(3,3,26,2,'#9eaa96');r(4,6,2,2,'#48574f');r(25,20,2,2,'#48574f')}
if(t==='B'){r(0,0,32,32,'#503f33');for(let j=0;j<3;j++)for(let k=-1;k<2;k++){let i=k*16+(j%2)*8,l=Math.max(1,i+1),right=Math.min(31,i+15);if(right<=l)continue;r(l,j*10+1,right-l,9,'#b96743');r(l,j*10+1,right-l,2,'#e19967');r(l,j*10+8,right-l,2,'#924d36')}}
if(t==='S'||t==='A'){
  const boot=t==='S',rim=boot?'#78d9ff':'#ffd77d';
  r(3,4,26,24,'#1a2528');r(4,5,24,22,rim);r(6,7,20,18,boot?'#284f69':'#74512f');
  if(boot){r(10,10,7,10,'#a6e6ff');r(14,17,8,4,'#a6e6ff');r(9,21,14,2,'#ffffff');r(9,9,9,2,'#50c4f7')}
  else{r(9,14,11,7,'#26282a');r(11,12,7,11,'#26282a');r(15,10,3,3,'#ffe7a7');r(19,11,5,2,'#fff0ae');r(21,9,2,6,'#fff0ae')}
}
if(t==='C'){let z=Math.round(Math.sin(clock*4)*1.5);r(13,5+z,6,3,'#e3fff2');r(10,8+z,12,5,'#8ef4cf');r(7,13+z,18,6,'#5ee4ba');r(10,19+z,12,4,'#34b595');r(13,23+z,6,3,'#34b595')}
if(t==='E'){r(3,3,26,26,'#18291f');r(5,5,22,22,collected===3?'#b5df80':'#71796a');r(8,8,16,16,'#28382d');r(13,10,6,12,collected===3?'#c9ff96':'#899184');r(10,16,12,3,collected===3?'#c9ff96':'#899184')}}
function draw(){map.forEach((row,y)=>row.forEach((t,x)=>tile(x,y,t)));for(const bomb of bombs){let x=bomb.x*32,y=bomb.y*32;rect(x+8,y+13,17,13,'#111b1e');rect(x+11,y+10,11,18,'#192228');rect(x+11,y+13,5,3,'#899a92');rect(x+18,y+6,4,5,'#e3ad67');rect(x+21,y+4,4,4,Math.sin(clock*20)>0?'#fff9bf':'#ff8050')}
for(const actor of [...bots,player]){const npc=actor!==player;let x=actor.x*32,y=actor.y*32;rect(x+6,y+25,20,4,'#223128');rect(x+8,y+22,6,5,'#e6a16a');rect(x+19,y+22,6,5,'#e6a16a');rect(x+9,y+16,14,8,npc?'#a94445':'#56a4b2');rect(x+6,y+4,20,14,npc?'#ef645a':'#eae9cd');rect(x+8,y+2,16,3,npc?'#ff9b74':'#ffffe8');rect(x+9,y+8,15,7,'#213a40');rect(x+12,y+9,2,3,'#91eadf');rect(x+19,y+9,2,3,'#91eadf');}for(const f of flames){let a=f.x*32,b=f.y*32;rect(a+1,b+8,30,16,'#ef743c');rect(a+7,b+2,18,28,'#ff9a42');rect(a+10,b+7,12,18,'#fff0a1')}}
function frame(now){let dt=Math.min(.06,(now-last)/1000);last=now;clock+=dt;if(mode==='play'){cool=Math.max(0,cool-dt);flames=flames.filter(f=>(f.time-=dt)>0);for(const b of bombs)b.time-=dt;
detonate();if(held)move(held);
if(mode==='play')for(const bot of bots){bot.wait-=dt;bot.rearm-=dt;if(bot.wait<=0){think(bot);collect(bot);bot.wait=stepTime(bot)}}
hud()}draw();requestAnimationFrame(frame)}
const keys={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
onkeydown=e=>{if(mode!=='play'||e.target===$('maps'))return;let k=keys[e.key]||keys[e.key.toLowerCase()];if(k){e.preventDefault();held=k;move(k)}if(e.code==='Space'){e.preventDefault();if(!e.repeat)drop()}};onkeyup=e=>{if(held===(keys[e.key]||keys[e.key.toLowerCase()]))held=null};onblur=()=>{held=null};
document.querySelectorAll('[data-key]').forEach(btn=>{btn.onpointerdown=e=>{btn.setPointerCapture(e.pointerId);held=btn.dataset.key;move(held)};btn.onlostpointercapture=()=>held=null});$('drop').onclick=drop;$('start').onclick=()=>{reset();$('start').blur()};function preview(index){
  stage=stages[index];reset();mode='ready';$('cover').hidden=false;
  $('sector').textContent='FUSE LAB　//　0'+(index+1);
  $('heading').textContent=stage.name;$('brief').textContent=stage.brief;
  $('hint').textContent='红盔是敌人。留意引信，放弹后绕到墙后！';
  $('start').textContent='进入迷宫　▶';
}
$('maps').onchange=()=>{const index=Number($('maps').value);
  if(mode==='play'&&!confirm('切换地图会重新开局，继续吗？')){$('maps').value=String(stages.indexOf(stage));return}
  preview(index);
};
preview(0);requestAnimationFrame(frame)
</script></html>
